# Base44 development environment.
#
# Runs the site from the cloned source (bind mount) with Vite's dev server on
# host port 3000, so edits appear in the preview without an image rebuild.
services:
  web:
    image: node:22
    working_dir: /app
    # Dependencies live in a named volume; install from the lockfile once the
    # mount is available, then hand off to the dev server.
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      # Bare passthrough: Vite appends this to server.allowedHosts (>= 6.1).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:
